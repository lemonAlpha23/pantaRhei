[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pantarhei-backend"
version = "0.1.0"
description = "Panta Rhei local workspace and feature plugins"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<52; sys_platform == 'darwin' or sys_platform == 'linux'",
    "keyring>=25,<27; sys_platform == 'darwin'",
    "secretstorage>=3.3,<4; sys_platform == 'linux'",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10"]
package = ["pyinstaller>=6.11,<7"]

[tool.uv.dependency-groups]
package = {requires-python = ">=3.11,<3.16"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.plugins.market" = ["snapshots/*.json", "snapshots/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
